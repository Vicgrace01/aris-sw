<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARIS-SW · Mshauri wa Kilimo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0f14; color: #e6edf5;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      padding: 16px 24px; border-bottom: 1px solid #24303f;
      display: flex; align-items: center; gap: 12px; background: #121821;
    }
    header .logo {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #22b57f, #2b9bf0);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px;
    }
    header .titles { flex: 1; }
    header h1 { font-size: 16px; font-weight: 600; }
    header p { font-size: 12px; color: #8a9bb0; }
    .lang-toggle {
      display: flex; gap: 2px; background: #1c2a3a;
      border: 1px solid #2a3a4c; border-radius: 20px; padding: 3px;
    }
    .lang-toggle button {
      background: transparent; border: none; color: #8a9bb0;
      padding: 6px 14px; font-size: 12px; font-weight: 600;
      border-radius: 16px; cursor: pointer; transition: 0.15s;
      font-family: inherit;
    }
    .lang-toggle button.active { background: #22b57f; color: #04140d; }
    .lang-toggle button:not(.active):hover { color: #e6edf5; }

    #chat {
      flex: 1; overflow-y: auto; padding: 24px;
      max-width: 820px; margin: 0 auto; width: 100%;
    }
    .message {
      margin-bottom: 24px; display: flex; gap: 12px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .message.user { flex-direction: row-reverse; }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600;
    }
    .message.user .avatar { background: #2b9bf0; color: white; }
    .message.assistant .avatar { background: #22b57f; color: #04140d; }
    .bubble {
      max-width: 75%; padding: 14px 18px; border-radius: 16px;
      line-height: 1.55; font-size: 15px;
    }
    .message.user .bubble { background: #1c2a3a; border-bottom-right-radius: 4px; }
    .message.assistant .bubble { background: #182130; border: 1px solid #24303f; border-bottom-left-radius: 4px; }
    .bubble .section { margin-bottom: 14px; }
    .bubble .section:last-child { margin-bottom: 0; }
    .bubble .label {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.06em; color: #8a9bb0;
      margin-bottom: 4px; font-weight: 600;
    }
    .bubble .value { font-size: 14.5px; color: #e6edf5; }
    .bubble .value ul { list-style: none; padding-left: 0; }
    .bubble .value li { padding: 4px 0 4px 16px; position: relative; }
    .bubble .value li::before { content: "•"; position: absolute; left: 0; color: #22b57f; }
    .bubble .dont li::before { color: #ff6b6b; }
    .bubble .escalate { color: #ffb347; font-size: 14px; }
    .lang-fallback {
      font-size: 10px; color: #5a6a7d;
      margin-left: 4px; vertical-align: super; font-weight: 600;
    }
    .play-btn {
      margin-top: 12px; padding: 8px 16px;
      background: #2b9bf0; border: none; border-radius: 20px;
      color: white; cursor: pointer; font-size: 13px;
      font-weight: 500; display: inline-flex;
      align-items: center; gap: 6px; font-family: inherit;
    }
    .play-btn:hover { background: #1a88e0; }
    .loading { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
    .loading .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #22b57f;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .loading .dot:nth-child(1) { animation-delay: -0.32s; }
    .loading .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    .loading-text { font-size: 13px; color: #8a9bb0; margin-left: 4px; }

    footer { padding: 16px 24px 24px; background: #0b0f14; }
    #triageBar {
      max-width: 820px; margin: 0 auto 12px;
      display: none; flex-wrap: wrap; gap: 8px;
    }
    #triageBar.active { display: flex; }
    .triage-chip {
      background: #1c2a3a; border: 1px solid #2b9bf0;
      color: #e6edf5; padding: 10px 16px; border-radius: 20px;
      cursor: pointer; font-size: 13.5px; transition: 0.15s;
      font-family: inherit;
    }
    .triage-chip:hover { background: #2b9bf0; color: white; }

    .input-bar {
      max-width: 820px; margin: 0 auto;
      display: flex; align-items: center; gap: 10px;
      background: #182130; border: 1px solid #24303f;
      border-radius: 28px; padding: 8px 8px 8px 20px;
    }
    .input-bar input {
      flex: 1; background: transparent; border: none;
      color: #e6edf5; font-size: 15px; outline: none; padding: 8px 0;
    }
    .input-bar input::placeholder { color: #5a6a7d; }
    .mic-btn, .send-btn {
      width: 44px; height: 44px; border-radius: 50%;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; transition: 0.15s;
    }
    .mic-btn { background: #24303f; color: #e6edf5; }
    .mic-btn:hover { background: #2f3f52; }
    .send-btn { background: #22b57f; color: #04140d; font-weight: 700; }
    .send-btn:hover { background: #1e9e6e; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Voice note panel (replaces input bar while recording/previewing) */
    #voiceNotePanel {
      max-width: 820px; margin: 0 auto;
      display: flex; align-items: center; gap: 12px;
      background: #182130; border: 1px solid #24303f;
      border-radius: 28px; padding: 8px 12px 8px 20px;
      min-height: 60px;
    }
    #voiceNotePanel[hidden] { display: none; }

    .volume-bars {
      display: flex; gap: 3px; align-items: center;
      height: 32px; flex: 1; overflow: hidden;
    }
    .volume-bar {
      width: 3px; background: #22b57f; border-radius: 2px;
      min-height: 3px; height: 3px;
      transition: height 0.08s ease;
    }

    .recording-timer, .preview-timer {
      font-size: 14px; color: #e6edf5;
      font-variant-numeric: tabular-nums;
      min-width: 44px; text-align: center;
      font-weight: 500;
    }
    .preview-timer { color: #8a9bb0; }

    .rec-action-btn {
      width: 40px; height: 40px; border-radius: 50%;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; transition: 0.15s;
      font-family: inherit;
    }
    .rec-action-btn:hover { filter: brightness(1.15); }
    .stop-rec-btn { background: #ff6b6b; color: white; }
    .stop-rec-btn:hover { background: #ff5252; }
    .discard-btn { background: #24303f; color: #e6edf5; }
    .discard-btn:hover { background: #2f3f52; }
    .send-voice-btn { background: #22b57f; color: #04140d; font-weight: 700; font-size: 18px; }
    .send-voice-btn:hover { background: #1e9e6e; }
    .play-preview-btn { background: #2b9bf0; color: white; font-size: 14px; }
    .play-preview-btn:hover { background: #1a88e0; }
    .play-preview-btn.playing { background: #22b57f; color: #04140d; }
  </style>
</head>
<body>
  <header>
    <div class="logo">AS</div>
    <div class="titles">
      <h1>ARIS-SW</h1>
      <p id="headerSub">Mshauri wa Kilimo · Swahili Agricultural Advisor</p>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button data-lang="sw" class="active">SW</button>
      <button data-lang="en">EN</button>
    </div>
  </header>

  <main id="chat">
    <div class="message assistant">
      <div class="avatar">AS</div>
      <div class="bubble" id="greeting">
        Habari! Mimi ni ARIS-SW, mshauri wako wa kilimo. Uliza swali lolote kuhusu kilimo chakula, au bonyeza kitufe cha maikrofoni na zungumza kwa Kiswahili.
      </div>
    </div>
  </main>

  <footer>
    <div id="triageBar"></div>
    <div id="voiceNotePanel" hidden></div>
    <div class="input-bar" id="inputBar">
      <input type="text" id="textInput" placeholder="Andika swali lako hapa..." />
      <button class="mic-btn" id="micBtn" title="Rekodi sauti">🎤</button>
      <button class="send-btn" id="sendBtn" disabled>➤</button>
    </div>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
