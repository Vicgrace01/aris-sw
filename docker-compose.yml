services:
  aris-sw:
    build:
      context: .
      dockerfile: Dockerfile
    image: aris-sw:local
    container_name: aris-sw
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      SESSION_DB_PATH: /app/data/persist/sessions.db
      GROQ_CACHE_PATH: /app/data/persist/groq-cache.jsonl
    volumes:
      - aris-persist:/app/data/persist
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  aris-persist: